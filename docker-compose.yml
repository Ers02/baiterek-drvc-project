version: "3.9"

services:
  # ─── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drvc_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:8000"

  # ─── React Frontend + Nginx ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drvc_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
